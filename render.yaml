services:
  - type: web
    name: skill-demand-ai
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: skilldemand-db
          property: connectionString

databases:
  - name: skilldemand-db
    plan: free
    databaseName: skilldemand
    user: skilldemand_user
